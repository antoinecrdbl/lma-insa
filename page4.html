<!DOCTYPE html>
<html>
<head>
    <title>Winamp Player</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans&family=VT323&family=Silkscreen&display=swap" rel="stylesheet">
</head>
<body>
    <div class="page-center">
        <div class="window winamp open">
            <div class="titlebar">
                <span class="text">WINAMP</span>
                <div class="buttons">
                    <span class="btn">_</span>
                    <span class="btn">□</span>
                    <a class="btn" href="index.html">✕</a>
                </div>
            </div>

            <div class="player">
                <div class="display">
                    <div class="visualizer">
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="info">
                        <div class="time">01:23</div>
                        <div class="marquee"><span>read the first letter of each song starting with the 2nd :) </span></div>
                    </div>
                </div>

                <div class="seek"><div class="seek-fill"></div></div>

                <div class="controls">
                    <span>|◀</span>
                    <span>▶</span>
                    <span>❚❚</span>
                    <span>■</span>
                    <span>▶|</span>

                </div>
                <div class="playlist">
                    <a class="track playing"><span>1. Hint</span><span>3:42</span></a>
                    <a class="track" href="https://www.youtube.com/watch?v=i0JafaRjO4k&list=RDi0JafaRjO4k"><span>2. TNT for the brain</span><span>5:17</span></a>
                    <a class="track" href="https://www.youtube.com/watch?v=84sHTvn6xf8&list=RD84sHTvn6xf8"><span>3. Everytime we touch</span><span>3:17</span></a>
                    <a class="track" href="https://youtu.be/N0tOm2mjWAw?si=1oJiD79h7r3Em2fg"><span>4. In my life</span><span>2:25</span></a>
                    <a class="track" href="https://youtu.be/kPlSyYtE63M?si=EivJT85FC1P1mIUI"><span>5. Until I found you</span><span>2:56</span></a>
                    <a class="track" href="https://youtu.be/Ll4NJs3NBIU?si=R308pG2K6ZmNokGQ"><span>6. Bad Romance (Rock ver.)</span><span>4:08</span></a>
                    <a class="track" href="https://youtu.be/vv3um0BlygY?si=hf8iUp93p22buts1"><span>7. Enchanted</span><span>5:52</span></a>
                    <a class="track" href="https://youtu.be/rCElGHuHDwY?si=MDNTx1tj0hCXzvfp"><span>8. Sadeness</span><span>4:15</span></a>
                    <a class="track" href="https://youtu.be/7SX06NRJ8GM?si=jNVKCBoEslHeYF2i"><span>9. Count me in</span><span>3:00</span></a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
